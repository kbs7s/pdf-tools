<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PDF Tools</title>
  <meta name="description" content="Free PDF tools that run entirely in your browser. Your files never leave your device.">
  <meta name="theme-color" content="#d6453d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/jszip.min.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#"><span class="logo">PDF</span><span data-i18n="appName">PDF Tools</span></a>
    <span class="spacer"></span>
    <span class="net-badge hidden" id="netBadge" data-i18n="offBadge">Offline</span>
    <a class="lang-btn hdr-files" href="#files"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i18n="myFiles">My files</span></a>
    <button class="lang-btn" id="langBtn" type="button">العربية</button>
  </header>
  <main id="app"></main>
  <footer>
    <span data-i18n="privacy">Your files are processed on your device and are never uploaded.</span>
  </footer>
  <div class="busy" id="busy"><div class="box"><div class="spinner"></div><div id="busyText">Working…</div></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
